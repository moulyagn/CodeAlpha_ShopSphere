{% extends "base.html" %}
{% block title %}Manage orders{% endblock %}
{% block content %}<section class="admin-page"><div class="container"><div class="admin-head"><div><p class="eyebrow">Fulfilment control</p><h1>Manage <span class="gold-text">orders.</span></h1></div></div><section class="admin-panel">{% for order in orders %}<div class="admin-list-row"><span>{{ order.order_number }}<small>{{ order.user.email }} · ₹{{ "{:,.0f}".format(order.total) }}</small></span><form method="post" action="{{ url_for('admin.update_order_status', order_id=order.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select class="form-select admin-status-select" name="status"><option {% if order.status == 'Pending' %}selected{% endif %}>Pending</option><option {% if order.status == 'Confirmed' %}selected{% endif %}>Confirmed</option><option {% if order.status == 'Packed' %}selected{% endif %}>Packed</option><option {% if order.status == 'Shipped' %}selected{% endif %}>Shipped</option><option {% if order.status == 'Delivered' %}selected{% endif %}>Delivered</option><option {% if order.status == 'Cancelled' %}selected{% endif %}>Cancelled</option><option {% if order.status == 'Returned' %}selected{% endif %}>Returned</option></select><button class="text-button">Update</button></form></div>{% else %}<p class="section-copy">No orders yet.</p>{% endfor %}</section></div></section>{% endblock %}
