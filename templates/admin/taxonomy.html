{% extends "base.html" %}
{% block title %}Manage {{ title }}{% endblock %}
{% block content %}<section class="admin-page"><div class="container"><div class="admin-head"><div><p class="eyebrow">Catalog taxonomy</p><h1>Manage <span class="gold-text">{{ title }}.</span></h1></div><a class="btn btn-outline-gold" href="{{ url_for('admin.dashboard') }}">Overview</a></div><div class="admin-grid"><form method="post" class="admin-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Add {{ title[:-1] }}</p><div class="field-group"><label class="form-label">Name</label><input class="form-control" name="name" required></div><div class="field-group"><label class="form-label">Description</label><textarea class="form-control" name="description"></textarea></div><button class="btn btn-gold w-100">Create {{ title[:-1] }}</button></form><section class="admin-panel">{% for record in records %}<div class="admin-list-row"><span>{{ record.name }}<small>{{ record.slug }}</small></span><span>{{ record.products|length }} products</span></div>{% endfor %}</section></div></div></section>{% endblock %}
