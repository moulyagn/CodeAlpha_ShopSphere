{% extends "base.html" %}
{% block title %}Admin sign in{% endblock %}
{% block content %}<section class="auth-page"><div class="auth-panel"><p class="eyebrow">Private console</p><h1>ShopSphere<br><span class="gold-text">admin.</span></h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field-group"><label class="form-label">Admin email</label><input class="form-control" name="email" type="email" required></div><div class="field-group"><label class="form-label">Admin password</label><input class="form-control" name="password" type="password" required></div><button class="btn btn-gold w-100 btn-lg">Enter console</button></form><p class="footer-note mt-3">Credentials are configured through ADMIN_EMAIL and ADMIN_PASSWORD.</p></div></section>{% endblock %}
